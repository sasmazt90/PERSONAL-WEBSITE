name: Refine Blog CMS Back Save Regression

on:
  push:
    branches:
      - feat/blog-cms-related-table-media
    paths:
      - '.github/trigger-blog-cms-content-controls'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blog-cms-related-table-media
      - name: Make preservation assertion semantic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('e2e/blog-cms.spec.ts')
          s = p.read_text()
          old = "expect(collection.posts.some((post: any) => post.content?.en?.includes('Back save race preserved'))).toBeTruthy();"
          new = "expect(collection.posts.some((post: any) => post.content?.en?.includes('Back save race') && post.content?.en?.includes('preserved'))).toBeTruthy();"
          if old not in s:
              raise SystemExit('Expected preservation assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/blog-cms.spec.ts
          git commit -m 'Assert back-save preservation semantically'
          git push origin HEAD:feat/blog-cms-related-table-media
