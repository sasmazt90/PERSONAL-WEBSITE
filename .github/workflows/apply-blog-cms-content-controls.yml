name: Repair Blog CMS Regression Spec

on:
  push:
    branches:
      - feat/blog-cms-related-table-media
    paths:
      - '.github/trigger-blog-cms-content-controls'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blog-cms-related-table-media
      - name: Remove stray regression escape
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('e2e/blog-cms.spec.ts')
          s = p.read_text()
          needle = "\n\\\ntest('Back preserves edits made while its save request is in flight'"
          replacement = "\ntest('Back preserves edits made while its save request is in flight'"
          if needle not in s:
              raise SystemExit('Expected stray escape not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/blog-cms.spec.ts
          git commit -m 'Repair back-save regression syntax'
          git push origin HEAD:feat/blog-cms-related-table-media
