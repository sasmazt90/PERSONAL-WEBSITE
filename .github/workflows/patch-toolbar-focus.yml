name: Patch Blog Editor Toolbar Focus

on:
  push:
    branches:
      - feat/blog-cms-related-table-media
    paths:
      - '.github/patch-toolbar-focus.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blog-cms-related-table-media
      - name: Preserve editor focus on toolbar pointer down
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/src/components/admin/RichTextEditor.tsx')
          s = p.read_text()
          old = '''      disabled={disabled}
      onClick={onClick}
      className={`inline-flex min-h-9 items-center justify-center gap-1 rounded-lg border px-2.5 text-xs font-semibold transition disabled:cursor-not-allowed disabled:opacity-35 ${active ? "border-blue-400/60 bg-blue-500 text-white" : "border-white/10 bg-white/[0.06] text-slate-200 hover:bg-white/12"}`}'''
          new = '''      disabled={disabled}
      onMouseDown={(event) => event.preventDefault()}
      onClick={onClick}
      className={`inline-flex min-h-9 items-center justify-center gap-1 rounded-lg border px-2.5 text-xs font-semibold transition disabled:cursor-not-allowed disabled:opacity-35 ${active ? "border-blue-400/60 bg-blue-500 text-white" : "border-white/10 bg-white/[0.06] text-slate-200 hover:bg-white/12"}`}'''
          if old not in s:
              raise SystemExit('Toolbar button anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit toolbar focus fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/components/admin/RichTextEditor.tsx
          git commit -m 'Preserve editor focus across toolbar actions'
          git push origin HEAD:feat/blog-cms-related-table-media
